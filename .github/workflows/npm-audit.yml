on:
  workflow_call:
    inputs:
      paths:
        description: 'Space separated list of paths to search for .nvmrc files'
        default: 'public/modules/custom'
        required: false
        type: string
      audit_level:
        description: 'Minimum vulnerability severity to fix: info, low, moderate, high or critical'
        default: 'high'
        required: false
        type: string
      fetch_hdbt:
        description: 'Whether to fetch hdbt at the commit locked in composer.lock'
        default: true
        required: false
        type: boolean
jobs:
  npm_audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Check out hdbt at the locked commit for the theme builder dependency.
      - name: Fetch hdbt
        if: inputs.fetch_hdbt
        run: |
          REF=$(jq -r '.packages[] | select(.name == "drupal/hdbt") | .source.reference' composer.lock)
          if [ -n "$REF" ] && [ "$REF" != "null" ]; then
            git init -q public/themes/contrib/hdbt
            git -C public/themes/contrib/hdbt fetch -q --depth 1 https://github.com/City-of-Helsinki/drupal-hdbt.git "$REF"
            git -C public/themes/contrib/hdbt checkout -q FETCH_HEAD
          fi

      # The update-config workflow updates the custom module packages.
      - name: Run npm audit
        id: npm_audit
        env:
          SEARCH_PATHS: ${{ inputs.paths }}
          AUDIT_LEVEL: ${{ inputs.audit_level }}
        run: |
          find $SEARCH_PATHS -name node_modules -prune -o -type f -name ".nvmrc" -exec sh -c '
            dir=$(dirname "$1")
            node_version=$(cat "$1")
            echo "Using Node.js version $node_version in $dir"
            cd "$dir"
            export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install $node_version
            nvm use $node_version
            npm install --global npm@12 --loglevel=error
            set +e
            npm audit --package-lock-only --audit-level="$AUDIT_LEVEL" --loglevel=error;
            # The npm audit command will exit with a 0 exit code if no vulnerabilities at or above the audit level were found.
            if [ $? -gt 0 ]; then
              npm audit fix --package-lock-only --audit-level="$AUDIT_LEVEL" --loglevel=error;
              if [ $? -gt 0 ]; then
                echo "BC_BREAK=:exclamation: NPM Audit fix could not fix all vulnerabilities. Fix them manually by running \`npm audit fix --force\` and test the functionalities thoroughly as there might be breaking changes. :exclamation:" >> $GITHUB_ENV;
              fi;
              echo "CREATE_PR=true" >> $GITHUB_OUTPUT;
            fi;
            set -e
          ' sh {} \;


      - name: Create Pull Request
        if: steps.npm_audit.outputs.CREATE_PR == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: Updated node modules based on npm audit fix
          title: Automatic npm audit fix
          labels: auto-update
          body: |
            # Npm audit

            ${{ env.BC_BREAK }}

            ## How to install

            * Update the HDBT theme
               * `git fetch --all`
               * `git checkout automation/npm-audit`
               * `git pull origin automation/npm-audit`
            * In the folder with the updated `package-lock.json`, run `nvm use && npm i && npm run build`

            ## How to test
            Run `npm audit`

            * [ ] Check that the `npm audit` prints `found 0 vulnerabilities`
            * [ ] Check that the changes for distributed files are sensible

          branch: automation/npm-audit
