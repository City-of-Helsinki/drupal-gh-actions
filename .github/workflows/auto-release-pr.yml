on:
  workflow_call:
    secrets:
      gh_token:
        required: true
name: Automatic release PR
jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Create pull request
        run: |
          gh pr create \
            --base main \
            --head dev \
            --title "Dev to main" \
            --body "Dev to main" || true
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
