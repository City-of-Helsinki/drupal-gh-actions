on:
  workflow_call:
    secrets:
      automatic_update_token:
        required: true
env:
  GH_TOKEN: ${{ github.token }}
  SUBTHEME_DIR: public/themes/custom/hdbt_subtheme
  HDBT_DIR: public/themes/contrib/hdbt
jobs:
  update-config:
    runs-on: ubuntu-latest
    outputs:
      pr-operation: ${{ steps.create-pr.outputs.pull-request-operation }}
    container:
      image: ghcr.io/city-of-helsinki/drupal-web:8.5
      options: --hostname app --user 1001
    services:
      db:
        image: mysql:8
        env:
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_DATABASE: drupal
          MYSQL_ROOT_PASSWORD: drupal
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download latest dump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download -n dump.sql

      - name: Prepare setup
        run: |
          # We install Drupal from existing dump, so locale_install() hook
          # is never fired. Make sure the translations folder exists.
          mkdir -p public/sites/default/files/translations -p

      - name: Build project
        run: |
          composer install --no-interaction --no-dev
          $(drush sql:connect --extra=--skip-ssl) < dump.sql
          drush cim -y && drush updb -y && drush cr
          composer update -W --no-interaction

          # Make sure new patches are installed.
          composer install --no-interaction --no-dev

          # Update translations from localize.drupal.org and helfi-modules
          # before running update hooks to reduce clutter in configuration files.
          drush locale:check && drush locale:update
          drush updb -y

          # Run Platform config updates if command exists.
          # Note. The helfi:platform-config:update needs to be run before the
          # helfi:locale-import. This may increase the number of obsolete
          # variables in configuration translations, but running the commands
          # in reverse order would prevent configuration translation rewrites
          # from being applied.
          if drush helfi:platform-config:update --help > /dev/null 2>&1; then
            drush helfi:platform-config:update
          fi

          # Update translations from helfi_platform_config. These translations
          # consists of overrides for non customised translations and will
          # override current translation with a non customised translation.
          drush helfi:locale-import helfi_platform_config

          # Export configuration.
          drush cex -y

          # Update platform
          drush helfi:tools:update-platform

      - name: Check module versions
        id: module-status
        run: |
          MODE="delete"
          drush helfi:tools:check-composer-versions "$(pwd)/composer.lock" --format=markdown_table >> $GITHUB_STEP_SUMMARY && EXIT_CODE=$? || EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 3 ]; then
            MODE="upsert"
            echo "  " >> $GITHUB_STEP_SUMMARY
            echo ":warning: Failed to install the latest version of the packages listed above" >> $GITHUB_STEP_SUMMARY
            echo "  " >> $GITHUB_STEP_SUMMARY
            echo "Please run \`composer why-not drupal/package_name package_version\` to see why." >> $GITHUB_STEP_SUMMARY
          fi
          echo "MODE=$MODE" >> $GITHUB_OUTPUT
          cat $GITHUB_STEP_SUMMARY > /tmp/pr-message.txt

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: Update configuration
          token: ${{ secrets.automatic_update_token }}
          title: Automatic update
          labels: auto-update
          body: |
            - Updated active configuration.
            - Updated platform
          branch: update-configuration

      - name: Attempt to find PR
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        id: find-pr
        run: echo "number=$(gh pr list --base ${BRANCH_NAME} --head update-configuration --json number --jq '.[].number')" >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        if: ${{ steps.find-pr.outputs.number != '' }}
        with:
          comment-tag: status
          mode: ${{ steps.module-status.outputs.MODE }}
          file-path: /tmp/pr-message.txt
          pr-number: ${{ steps.find-pr.outputs.number }}

  update-theme-build:
    needs: update-config
    if: needs.update-config.outputs.pr-operation == 'created' || needs.update-config.outputs.pr-operation == 'updated'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: update-configuration
          persist-credentials: false

      # Check out hdbt at the locked commit from composer.lock.
      - name: Fetch hdbt
        run: |
          REF=$(jq -r '.packages[] | select(.name == "drupal/hdbt") | .source.reference' composer.lock)
          git init -q "$HDBT_DIR"
          git -C "$HDBT_DIR" fetch -q --depth 1 https://github.com/City-of-Helsinki/drupal-hdbt.git "$REF"
          git -C "$HDBT_DIR" checkout -q FETCH_HEAD

      # Install the subtheme npm packages without running package scripts.
      - name: Install dependencies
        run: |
          run_npm() {
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp \
              --env PATH=/tmp/npm/bin:/usr/local/bin:/usr/bin:/bin \
              --volume "$PWD/public:/app/public" \
              --workdir "/app/$1" \
              node:24-alpine \
              sh -c "npm install --global --prefix /tmp/npm npm@12 --no-audit --no-fund > /dev/null && hash -r && $2"
          }

          if jq -e '.scripts.postinstall' "$SUBTHEME_DIR/package.json" > /dev/null; then
            run_npm "$HDBT_DIR" 'npm ci --ignore-scripts --no-audit --no-fund && npm audit signatures'
          fi
          # Re-read the builder from hdbt.
          run_npm "$SUBTHEME_DIR" 'npm install ../../contrib/hdbt/theme-builder --ignore-scripts --no-audit --no-fund --min-release-age=3'

          # Update packages with critical advisories within their ranges.
          CRITICAL=$(run_npm "$SUBTHEME_DIR" 'npm audit --json || true' \
            | jq -r '.vulnerabilities // {} | to_entries[] | select(any(.value.via[]; type == "object" and .severity == "critical")) | .key' \
            | xargs)
          if [ -n "$CRITICAL" ]; then
            echo "Updating critical packages: $CRITICAL"
            run_npm "$SUBTHEME_DIR" "npm update $CRITICAL --ignore-scripts --no-audit --no-fund"
          fi
          run_npm "$SUBTHEME_DIR" 'npm audit signatures'

      # Build the subtheme.
      - name: Build subtheme
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --read-only \
            --tmpfs /tmp:rw,mode=1777,size=1g \
            --env HOME=/tmp \
            --env CI=true \
            --volume "$PWD/$SUBTHEME_DIR:/app/$SUBTHEME_DIR" \
            --volume "$PWD/$HDBT_DIR:/app/$HDBT_DIR:ro" \
            --workdir "/app/$SUBTHEME_DIR" \
            node:24-alpine \
            npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme
          path: |
            ${{ env.SUBTHEME_DIR }}/package-lock.json
            ${{ env.SUBTHEME_DIR }}/dist/
          if-no-files-found: error
          retention-days: 1

  # Commit the built HDBT subtheme to the update PR.
  update-theme-commit:
    needs: update-theme-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: update-configuration
          token: ${{ secrets.automatic_update_token }}

      - name: Remove old dist
        run: rm -rf "$SUBTHEME_DIR/dist"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme
          path: ${{ env.SUBTHEME_DIR }}

      # Commit only the lockfile and dist.
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Update theme
          file_pattern: ${{ env.SUBTHEME_DIR }}/package-lock.json ${{ env.SUBTHEME_DIR }}/dist
